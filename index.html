<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f7fb" />
    <title>Flow</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell" aria-label="タスク管理">
      <section id="loading" class="skeleton-page" aria-label="読み込み中">
        <div class="skeleton orb"></div><div class="skeleton line wide"></div><div class="skeleton line"></div>
        <div class="skeleton card"></div><div class="skeleton card"></div><div class="skeleton card"></div>
      </section>
      <section id="app" class="app" hidden>
        <header class="topbar"><button id="profile" class="avatar" aria-label="ログイン">◎</button><div class="date"><span id="day"></span><strong>今日</strong></div><button id="settings" class="icon-button" aria-label="設定">⋯</button></header>
        <section class="quick-capture" aria-label="クイックメモ">
          <label for="task-input">今、やること</label>
          <div class="composer"><input id="task-input" autocomplete="off" placeholder="メモを入力" /><button id="add-task" aria-label="タスクを追加">＋</button></div>
        </section>
        <nav class="tabs" aria-label="表示切替"><button class="tab active" data-filter="all">すべて <span id="count-all">0</span></button><button class="tab" data-filter="active">進行中 <span id="count-active">0</span></button><button class="tab" data-filter="done">完了 <span id="count-done">0</span></button></nav>
        <p class="gesture-hint">← 完了　　保留 →</p>
        <section id="task-list" class="task-list" aria-live="polite"></section>
        <button id="new-task" class="fab" aria-label="タスクを追加">＋</button>
      </section>
    </main>
    <template id="task-template"><article class="task-wrap"><div class="swipe-bg done-bg">✓</div><div class="swipe-bg later-bg">↷</div><div class="task-card"><button class="check" aria-label="完了にする"></button><p class="task-title"></p><span class="drag">⠿</span></div></article></template>
    <dialog id="login-dialog" class="glass-dialog"><button class="close" aria-label="閉じる">×</button><h2>同期する</h2><p>Google アカウントでタスクを安全に同期します。</p><button id="google-login" class="google"><span>G</span> Google で続ける</button></dialog>
    <script src="./app.js"></script>
  </body>
</html>
